<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fawz Haberdashery | Fancy Buckles Gold</title>

<link rel="stylesheet" href="global-images.css">

<style>
:root{
    --primary:#c40000;
    --dark:#222;
    --light:#fff;
    --bg:#f5f5f5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:var(--bg);
}

header{
    background:white;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

header h1{
    color:var(--primary);
}

.products{
    max-width:1400px;
    margin:auto;
    padding:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
}

.product-card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-5px);
}

.product-card img{
    width:100%;
    height:300px;
    object-fit:contain;
    background:white;
}

.product-info{
    padding:20px;
}

.product-info h2{
    margin-bottom:10px;
}

.product-info button{
    width:100%;
    padding:14px;
    border:none;
    background:var(--primary);
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:999;
}

.modal-content{
    background:white;
    width:95%;
    max-width:700px;
    margin:40px auto;
    border-radius:16px;
    padding:25px;
}

.close{
    float:right;
    cursor:pointer;
    font-size:28px;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:15px;
    margin-top:20px;
}

.option{
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    text-align:center;
    cursor:pointer;
}

.option img{
    width:100%;
    height:120px;
    object-fit:contain;
}

.option:hover{
    border-color:var(--primary);
}

.selected{
    border:2px solid var(--primary);
}
</style>
</head>
<body>

<header>
    <h1>Fancy Buckles Gold</h1>
</header>

<section class="products">

    <div class="product-card">
        <img src="images/buckles/home.png" alt="Fancy Buckles Gold">
        <div class="product-info">
            <h2>Fancy Buckles Gold</h2>
            <button onclick="openModal()">View Designs</button>
        </div>
    </div>

</section>

<div class="modal" id="productModal">
    <div class="modal-content">

        <span class="close" onclick="closeModal()">&times;</span>

        <h2>Fancy Buckles Gold</h2>

        <p>Select a buckle design:</p>

        <div class="option-grid">

            <div class="option" onclick="selectOption(this,'Design 1')">
                <img src="images/buckles/1.png">
                <p>Design 1</p>
            </div>

            <div class="option" onclick="selectOption(this,'Design 2')">
                <img src="images/buckles/2.png">
                <p>Design 2</p>
            </div>

            <div class="option" onclick="selectOption(this,'Design 3')">
                <img src="images/buckles/3.png">
                <p>Design 3</p>
            </div>

            <div class="option" onclick="selectOption(this,'Design 4')">
                <img src="images/buckles/4.png">
                <p>Design 4</p>
            </div>

            <div class="option" onclick="selectOption(this,'Design 5')">
                <img src="images/buckles/5.png">
                <p>Design 5</p>
            </div>

            <div class="option" onclick="selectOption(this,'Design 6')">
                <img src="images/buckles/6.png">
                <p>Design 6</p>
            </div>

            <div class="option" onclick="selectOption(this,'Design 7')">
                <img src="images/buckles/7.png">
                <p>Design 7</p>
            </div>

            <div class="option" onclick="selectOption(this,'Design 8')">
                <img src="images/buckles/8.png">
                <p>Design 8</p>
            </div>

            <div class="option" onclick="selectOption(this,'Design 9')">
                <img src="images/buckles/9.png">
                <p>Design 9</p>
            </div>

        </div>

        <button id="addToCartBtn"
                style="margin-top:20px;width:100%;padding:14px;background:#c40000;color:white;border:none;border-radius:10px;">
            Add To Cart
        </button>

    </div>
</div>

<script>

let selectedDesign = '';

function openModal(){
    document.getElementById('productModal').style.display='block';
}

function closeModal(){
    document.getElementById('productModal').style.display='none';
}

function selectOption(el,name){

    document.querySelectorAll('.option')
    .forEach(opt=>opt.classList.remove('selected'));

    el.classList.add('selected');

    selectedDesign=name;
}

document.getElementById('addToCartBtn')
.addEventListener('click',()=>{

    if(!selectedDesign){
        alert('Please select a design');
        return;
    }

    console.log('Add To Cart:',selectedDesign);

    // Firebase add-to-cart goes here

});

window.onclick=function(event){

    let modal=document.getElementById('productModal');

    if(event.target===modal){
        closeModal();
    }
}
</script>

</body>
</html>
